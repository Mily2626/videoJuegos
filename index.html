<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Catálogo de Videojuegos</title>
</head>
<body>

    <h1>Catálogo de Videojuegos</h1>
    <div id="catalogo"></div>

    <h2>Agregar Videojuego</h2>

    <input
        type="text"
        id="nombre"
        placeholder="Nombre del videojuego">
    <input
        type="text"
        id="categoria"
        placeholder="categoria del videojuego">
    <input
        type="number"
        id="precio"
        placeholder="precio del videojuego">
    <input
        type="text"
        id="plataforma"
        placeholder="plataforma">
    <input
        type="text"
        id="lanzamiento"
        placeholder="fecha">
    <input
        type="text"
        id = "imagen"
        placeholder="URL de la imagen">
    <button id="agregar">
        Agregar
    </button>

    <div id="catalogo"></div>
    
    
    <script src="app.js"></script>
</body>
</html>
